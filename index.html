<html lang="fr"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, balance on top, donut + category buttons, bottom tab bar (Accueil, Historique, Crédits). */
:root {
  --bg: #F3F5F9;
  --pj: #7B5CC8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --ink: #0F1B2D;
  --ink-2: #5A6B82;
  --line: #DCE2EB;
  --accent: #2456C8;
  --accent-ink: #FFFFFF;
  --expense: #C8472F;
  --income: #0E8A6A;
  --loan: #B06F10;
  --scrim: rgba(10, 18, 32, 0.45);
  --c0: #0B7A66; --c1: #C8472F; --c2: #D49A1F; --c3: #3D6FB6; --c4: #8A4F9E;
  --c5: #5E8C31; --c6: #D1678A; --c7: #2E8FA3; --c8: #7A6A58; --c9: #A3A83A;
  --font-display: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1220; --surface: #121B2D; --surface-2: #1A2539; --ink: #E7ECF5; --ink-2: #90A1B9; --pj: #B39DFF;
    --line: #243249; --accent: #7AA2FF; --accent-ink: #0B1220; --expense: #F0816B; --income: #3FBF9F;
    --loan: #E0A94A; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #121B2D; --surface-2: #1A2539; --ink: #E7ECF5; --ink-2: #90A1B9; --pj: #B39DFF;
  --line: #243249; --accent: #7AA2FF; --accent-ink: #0B1220; --expense: #F0816B; --income: #3FBF9F;
  --loan: #E0A94A; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 520px; margin: 0 auto; padding-block: 12px 28px; display: flex; flex-direction: column; gap: 18px; }
.view[hidden] { display: none; }
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* Header + balance */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; color: var(--ink-2); text-transform: uppercase; }
.balance-label { color: var(--ink-2); font-size: 13px; margin-top: 10px; }
.balance { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; }
.balance small { font-size: 16px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Period selector */
.seg { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { padding: 8px 2px; border-radius: 9px; font-weight: 500; font-size: 13px; white-space: nowrap; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.pnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pnav .label { font-weight: 600; text-align: center; flex: 1; min-width: 0; }
.pnav button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.pnav button:hover { background: var(--surface-2); }
.pnav svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Donut */
.donut { position: relative; width: min(100%, 260px); aspect-ratio: 1; margin: 0 auto; }
.donut svg { width: 100%; height: 100%; display: block; }
.donut .ring-empty { stroke: var(--surface-2); }
.donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22%; pointer-events: none; }
.donut .center .k { font-size: 12px; color: var(--ink-2); }
.donut .center .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; line-height: 1.15; }
.donut .center .v small { font-size: 12px; font-weight: 500; color: var(--ink-2); }

/* Stats row */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--ink-2); }
.stat .v { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.stat .v.inc { color: var(--income); }
.stat .v.exp { color: var(--expense); }
.stat .v.loan { color: var(--loan); }

/* Category buttons */
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px 6px; }
.cat { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.cat .dot { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.cat .name { font-size: 12px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat:active .dot { transform: scale(0.94); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--expense); color: #fff; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.row-actions .btn { flex: 1 1 140px; }

/* Lists */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px 18px; text-align: center; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 17px; margin-bottom: 4px; }
.day { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 4px 2px 6px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { font-weight: 600; text-align: end; white-space: nowrap; }
.item .amt.inc { color: var(--income); }
.item .amt.exp { color: var(--expense); }
.item .amt.loan { color: var(--loan); }
.item .del { grid-column: 2 / -1; display: flex; gap: 8px; padding-top: 4px; }

/* Credits */
.loan-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card .who { font-family: var(--font-display); font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.card .meta { font-size: 13px; color: var(--ink-2); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.open { background: color-mix(in srgb, var(--loan) 18%, transparent); color: var(--loan); }
.pill.done { background: color-mix(in srgb, var(--income) 18%, transparent); color: var(--income); }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--income); border-radius: 999px; }
.figures { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.figures b { font-weight: 600; }
.pay-form { display: flex; gap: 8px; }
.pay-form input { flex: 1; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.pay-form input { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.history-link { font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.payments { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.payments div { display: flex; justify-content: space-between; gap: 10px; }

/* Bottom nav */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.scrim[hidden] { display: none; }
.sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.sheet .amount { font-family: var(--font-display); font-size: 30px; font-weight: 700; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.err { color: var(--expense); font-size: 13px; min-height: 1em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.note { font-size: 12px; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) {
  .cat .dot { transition: transform 0.12s ease; }
  .bar > i { transition: width 0.3s ease; }
}

/* v2 : icônes, comptes, réglages */
.ic { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cat .pct { font-size: 12px; font-weight: 600; color: var(--ink); min-height: 1.2em; }
.cat .name { font-size: 12px; }
.select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.field .select { background: var(--bg); }
#filter-wrap { margin-top: -6px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; padding: 6px 4px; color: var(--ink-2); }
.back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform: scaleX(-1); }
[dir="rtl"] .back svg { transform: none; }
[dir="rtl"] .pnav svg, [dir="rtl"] .row-btn .go { transform: scaleX(-1); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.group h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
.group .help { font-size: 13px; color: var(--ink-2); margin: -6px 0 0; }
.sub { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows:empty { display: none; }
.row-btn { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto 18px; gap: 12px; align-items: center; padding: 9px 12px; text-align: start; width: 100%; border-top: 1px solid var(--line); background: var(--surface); }
.rows .row-btn:first-child { border-top: 0; }
.row-btn .rt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.row-btn .rs { display: block; font-size: 13px; font-weight: 400; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .go { width: 18px; height: 18px; stroke: var(--ink-2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot.sm { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg3 button { padding: 8px 4px; border-radius: 9px; font-weight: 500; font-size: 14px; color: var(--ink-2); }
.seg3 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.acc-total { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -0.01em; }
.acc-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.acc-main { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; text-align: start; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; }
.acc-main .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.acc-main .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-main .s { display: block; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.icon-btn svg.ic { width: 20px; height: 20px; }
.preview { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; align-self: center; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icons button { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.icons button .ic { width: 24px; height: 24px; }
.icons button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: 1px; }
.swatches button[aria-pressed="true"] { border-color: var(--surface); outline: 3px solid var(--ink); }
.check { display: flex; align-items: center; gap: 10px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.field input[type="month"], .field input[type="time"] { min-height: 44px; }
@media (max-width: 380px) { .tabs button { font-size: 11px; } .cats { gap: 12px 2px; } }

/* v3 : accueil façon Monefy et calculatrice */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar .select { flex: 1; min-width: 0; }
#btn-settings { margin-inline-start: auto; }
[dir="rtl"] #btn-back svg { transform: scaleX(-1); }
.ringwrap { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 0 auto; }
.ringwrap .donut { position: absolute; left: 50%; top: 50%; width: 54%; transform: translate(-50%, -50%); margin: 0; }
.donut .center { padding: 0 16%; gap: 1px; }
.donut .cv { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.2; letter-spacing: -0.01em; max-width: 100%; overflow-wrap: anywhere; }
.donut .cv.inc { color: var(--income); }
.donut .cv.exp { color: var(--expense); }
.donut .cu { font-size: 11px; color: var(--ink-2); }
.rc { position: absolute; transform: translate(-50%, -50%); width: var(--s, 46px); height: var(--s, 46px); }
.ringwrap { background: var(--surface); border-radius: 24px; }
.rc .dot { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: var(--surface); border: 2px solid var(--c); transition: transform 0.12s ease; }
.rc .dot svg { stroke-width: 1.7; }
.rc.sel .dot { background: var(--c); color: #fff; transform: scale(1.14); }
.rc.dim { opacity: 0.45; }
.donut .seg { cursor: pointer; transition: opacity 0.12s; }
.donut .seg.off { opacity: 0.35; }
.donut .ck { font-size: 12px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc .pct { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.rc:active .dot { transform: scale(0.92); }
.balbar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; align-items: center; margin-top: 8px; }
.bar-main { cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bar-main .bl { font-size: 12px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-main .balance { font-size: 24px; }
.bar-main .balance small { font-size: 13px; }
.pm { display: flex; justify-content: space-evenly; padding-top: 4px; }
.pm button { width: 84px; height: 84px; border-radius: 50%; border: 6px solid; background: var(--surface); display: grid; place-items: center; }
.pm .minus { border-color: var(--expense); color: var(--expense); }
.pm .xfer { border-color: var(--ink-2); color: var(--ink-2); width: 64px; height: 64px; align-self: center; }
.pm .plus { border-color: var(--income); color: var(--income); }
.pm svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; }
.pm button:active { transform: scale(0.95); }
.calc { direction: ltr; display: flex; flex-direction: column; gap: 8px; }
.calc-display { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; text-align: right; min-height: 66px; }
.calc-expr { font-size: 14px; color: var(--ink-2); min-height: 1.4em; overflow-x: auto; white-space: nowrap; }
.calc-res { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.2; overflow-x: auto; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.keys button { height: 46px; border-radius: 12px; background: var(--surface-2); font-size: 20px; font-weight: 600; }

/* ---------- Périodes ---------- */
function rangeOf(period, anchor) {
  if (period === 'custom') { const a = state.cFrom || ymd(new Date()), b = state.cTo || a; return a <= b ? [a, b] : [b, a]; }
  if (period === 'all') return ['0000-01-01', '9999-12-31'];
  const a = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  if (period === 'day') return [ymd(a), ymd(a)];
  if (period === 'week') {
    const off = (a.getDay() + 6) % 7;
    const s = new Date(a); s.setDate(a.getDate() - off);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return [ymd(s), ymd(e)];
  }
  if (period === 'month') return [ymd(new Date(a.getFullYear(), a.getMonth(), 1)), ymd(new Date(a.getFullYear(), a.getMonth() + 1, 0))];
  return [ymd(new Date(a.getFullYear(), 0, 1)), ymd(new Date(a.getFullYear(), 11, 31))];
}
function shiftAnchor(dir) {

  else if (state.period === 'week') a.setDate(a.getDate() + 7 * dir);

}
function periodLabel() {
  if (state.period === 'custom') { const r = rangeOf('custom'); return shortDate(r[0]) + ' → ' + shortDate(r[1]); }
  if (state.period === 'all') return t('all');
  const r = rangeOf(state.period, state.anchor), s = r[0], e = r[1];
  if (state.period === 'day') return longDay(s) + ' ' + parseYmd(s).getFullYear();
  if (state.period === 'week') {

    return a.toLocaleDateString(loc(), same ? { day: 'numeric' } : { day: 'numeric', month: 'short' }) + ' – ' + b.toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: 'numeric' });
  }
  if (state.period === 'month') { const x = parseYmd(s).toLocaleDateString(loc(), { month: 'long', year: 'numeric' }); return x.charAt(0).toUpperCase() + x.slice(1); }
  return String(parseYmd(s).getFullYear());
}
const inRange = (d, r) => d >= r[0] && d <= r[1];

/* ---------- Calculs (f = 'all' ou l'id d'un compte) ---------- */
const paidOf = l => (l.payments || []).reduce((s, p) => s + Number(p.amount || 0), 0);
const remainingOf = l => Math.max(0, round2(Number(l.amount || 0) - paidOf(l)));
const accIncluded = id => { const a = accs().find(x => x.id === accId(id)); return !a || a.inTotal !== false; };
const takes = (f, id) => f === '*' || (f === 'all' ? accIncluded(id) : f === id);

function balanceFor(f) {
  let b = 0;
  accs().forEach(a => { if (takes(f, a.id)) b += Number(a.initial || 0); });
  Object.values(state.tx).forEach(x => {
    const a = accId(x.acc);
    if (x.kind === 'transfer') { if (takes(f, a)) b -= x.amount; if (takes(f, accId(x.to))) b += x.amount; return; }
    if (takes(f, a)) b += x.kind === 'income' ? x.amount : -x.amount;
  });
  Object.values(state.loans).forEach(l => {
    const s = l.dir === 'lent' ? -1 : 1;
    if (takes(f, accId(l.acc))) b += s * l.amount;
    (l.payments || []).forEach(p => { if (takes(f, accId(p.acc || l.acc))) b -= s * p.amount; });
  });
  Object.values(state.products || {}).forEach(pr => {
    if (prodCalc(pr).returned) return;
    (pr.payments || []).forEach(x => { if (x.acc && takes(f, accId(x.acc))) b += Number(x.amount || 0); });
  });
  goals().forEach(g => {
    (g.deposits || []).forEach(d => { if (d.acc && takes(f, accId(d.acc))) b -= Number(d.amount || 0); });
    if (f === 'all' && g.inTotal !== false) b += goalSaved(g);
  });
  return round2(b);
}
function periodStats(r, f) {
  let inc = 0, exp = 0, loan = 0;
  const byCat = {};
  Object.values(state.tx).forEach(x => {
    if (x.kind === 'transfer' || !inRange(x.date, r) || !takes(f, accId(x.acc))) return;
    if (x.kind === 'income') inc += x.amount;
    else { exp += x.amount; byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; }
  });
  Object.values(state.loans).forEach(l => {
    const s = l.dir === 'lent' ? -1 : 1;
    if (takes(f, accId(l.acc)) && inRange(l.date, r)) loan += s * l.amount;
    (l.payments || []).forEach(p => { if (takes(f, accId(p.acc || l.acc)) && inRange(p.date, r)) loan -= s * p.amount; });
  });

}
function accUsed(id) {

    Object.values(state.loans).some(l => hit(l.acc) || (l.payments || []).some(p => p.acc && hit(p.acc))) || fixeds().some(f => hit(f.acc)) ||

/* ---------- Dépenses fixes : appliquées à l'ouverture, avec la vraie date ---------- */
const applying = new Set();
const UNITS = ['day', 'week', 'month', 'year'];
/* Occurrences dues d'une dépense fixe : [{ key, due }] jusqu'à maintenant */
function occurrences(f, now) {
  const out = [], every = Math.max(1, parseInt(f.every, 10) || 1), unit = UNITS.indexOf(f.unit) >= 0 ? f.unit : 'month';
  const hm = (f.time || '09:00').split(':').map(Number);
  const mk = (y, m, d) => new Date(y, m, d, hm[0] || 0, hm[1] || 0);
  let guard = 0;
  if (unit === 'month') {
    if (!f.start) return out;
    const sp = f.start.split('-').map(Number);
    let y = sp[0], m = sp[1] - 1;
    while (guard++ < 600) {
      const ym = y + '-' + pad(m + 1);
      if (f.end && ym > f.end) break;
      const due = mk(y, m, Math.min(f.day || 1, new Date(y, m + 1, 0).getDate()));
      if (due > now) break;
      out.push({ key: ym, due: due });
      m += every; while (m > 11) { m -= 12; y++; }
    }
    return out;
  }
  if (!f.sdate) return out;
  const sp = f.sdate.split('-').map(Number);
  for (let i = 0; guard++ < 5000; i++) {
    let due;
    if (unit === 'year') { const y = sp[0] + i * every; due = mk(y, sp[1] - 1, Math.min(sp[2], new Date(y, sp[1], 0).getDate())); }
    else due = mk(sp[0], sp[1] - 1, sp[2] + i * every * (unit === 'week' ? 7 : 1));
    const key = ymd(due);
    if (f.end && key.slice(0, 7) > f.end) break;
    if (due > now) break;
    out.push({ key: key, due: due });
  }
  return out;
}
async function applyFixed() {
  if (!(loaded.s && loaded.t && loaded.l) || !store.ready) return;
  const now = new Date();
  let n = 0;
  for (const f of fixeds()) {
    if (f.active === false) continue;
    for (const o of occurrences(f, now)) {
      const id = 'fx-' + f.id + '-' + o.key;
      if (state.tx[id] || applying.has(id) || (f.skip || []).indexOf(o.key) >= 0) continue;
      applying.add(id);
      try {
        await store.put('tx', id, { kind: 'expense', amount: f.amount, cat: f.cat, acc: f.acc, date: ymd(o.due), note: f.name, ts: o.due.getTime(), fx: f.id, fxm: o.key });
        n++;
      } catch (e) { /* message déjà affiché */ } finally { applying.delete(id); }
    }
  }
  if (n) toast(t('tFixed', { n: n }));
}
function freqText(f) {
  const h = f.time || '09:00', n = Math.max(1, parseInt(f.every, 10) || 1), unit = UNITS.indexOf(f.unit) >= 0 ? f.unit : 'month';
  if (unit === 'month') return n === 1 ? t('everyMonth', { d: f.day, h: h }) : t('everyNMonthDay', { d: f.day, n: n, h: h });
  return t('everyN', { n: n, u: t('unit' + unit.charAt(0).toUpperCase() + unit.slice(1)), h: h });
}

/* ---------- Stockage : compte (db) ou appareil (localStorage) ---------- */
const LS_KEY = 'mizan-v1';
const notReady = async () => { toast(t('tLoading')); throw new Error('store-not-ready'); };
let store = { mode: 'local', ready: false, put: notReady, del: notReady, setSettings: notReady, replaceAll: notReady };

function localStore() {
  const data = { tx: {}, loans: {}, products: {}, settings: {} };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(data, JSON.parse(raw)); } catch (e) { /* stockage indisponible */ }
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) { /* ignoré */ } };
  const push = () => { state.tx = data.tx; state.loans = data.loans; state.products = data.products || {}; state.settings = data.settings; };
  push(); loaded.s = loaded.t = loaded.l = loaded.p = true;
  return {
    mode: 'local', ready: true, onChange: null,
    async put(coll, id, obj) { data[coll][id] = clone(obj); persist(); push(); this.onChange && this.onChange(); },
    async del(coll, id) { delete data[coll][id]; persist(); push(); this.onChange && this.onChange(); },
    async setSettings(obj) { data.settings = Object.assign({}, data.settings, clone(obj)); persist(); push(); this.onChange && this.onChange(); },
    /* remplace tout : { settings, tx, loans } */
    async replaceAll(all) {
      data.settings = clone(all.settings || {}); data.tx = clone(all.tx || {}); data.loans = clone(all.loans || {}); data.products = clone(all.products || {});
      persist(); push(); this.onChange && this.onChange();
    }
  };
}

function dbStore(db, uid, onChange) {
  const base = db.doc('data/users/' + uid + '/profile');
  const cols = { tx: base.collection('tx'), loans: base.collection('loans'), products: base.collection('products') };
  const fromSnap = snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); return m; };
  const fail = e => { toast(t('tFail')); throw e; };
  base.onSnapshot(s => { state.settings = (s.exists && s.data()) || {}; loaded.s = true; onChange(); }, () => {});
  cols.tx.onSnapshot(s => { state.tx = fromSnap(s); loaded.t = true; onChange(); }, () => {});
  cols.loans.onSnapshot(s => { state.loans = fromSnap(s); loaded.l = true; onChange(); }, () => {});
  cols.products.onSnapshot(s => { state.products = fromSnap(s); loaded.p = true; onChange(); }, () => {});
  return {
    mode: 'db', ready: true,
    async put(coll, id, obj) { try { await cols[coll].doc(id).set(clone(obj)); } catch (e) { fail(e); } },
    async del(coll, id) { try { await cols[coll].doc(id).delete(); } catch (e) { fail(e); } },
    async setSettings(obj) { try { await base.set(Object.assign({}, clone(state.settings), clone(obj))); } catch (e) { fail(e); } },
    async replaceAll(all) {
      try {
        for (const coll of ['tx', 'loans', 'products']) {
          const next = all[coll] || {};
          for (const id of Object.keys(state[coll])) if (!(id in next)) await cols[coll].doc(id).delete();
          for (const id of Object.keys(next)) await cols[coll].doc(id).set(clone(next[id]));
        }
        await base.set(clone(all.settings || {}));
      } catch (e) { fail(e); }
    }
  };
}

async function initStore(onChange) {
  let db = null, user = null, uid = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      db = await window.claude.use('db');
      user = await window.claude.use('user');
      if (user) uid = await user.id();
    }
  } catch (e) { db = null; }
  if (db && uid) return dbStore(db, uid, onChange);
  const s = localStore(); s.onChange = onChange;
  return s;
}

/* ---------- Accueil : anneau, icônes et pourcentages ---------- */
const OTHER_ID = '__other', OTHER_COLOR = '#8A948F', MAX_BUBBLES = 14;
let homeOthers = [];
/* Catégories affichées : toutes si 14 ou moins, sinon les 13 plus utilisées + « Autres » */
function homeSplit(st) {
  const list = catsOf('expense');
  if (list.length <= MAX_BUBBLES) return { vis: list, others: [] };
  const used = {};
  Object.values(state.tx).forEach(x => { if (x.kind === 'expense') used[x.cat] = (used[x.cat] || 0) + 1; });
  const ranked = list.map((c, i) => ({ c: c, i: i, v: st.byCat[c.id] || 0, u: used[c.id] || 0 }))
    .sort((a, b) => b.v - a.v || b.u - a.u || a.i - b.i);
  const top = new Set(ranked.slice(0, MAX_BUBBLES - 1).map(r => r.c.id));
  return { vis: list.filter(c => top.has(c.id)), others: ranked.filter(r => !top.has(r.c.id)).map(r => r.c).sort((a, b) => (st.byCat[b.id] || 0) - (st.byCat[a.id] || 0)) };
}
function donutHtml(st, sp, pj) {
  const R = 78, C = 2 * Math.PI * R, total = st.exp;
  const entries = sp.vis.map(c => ({ id: c.id, v: st.byCat[c.id] || 0, color: c.color, name: catName(c) }));
  const ov = sp.others.reduce((s, c) => s + (st.byCat[c.id] || 0), 0);
  if (sp.others.length) entries.push({ id: OTHER_ID, v: ov, color: OTHER_COLOR, name: t('others') });
  const act = entries.filter(e => e.v > 0).sort((a, b) => b.v - a.v);
  let segs = '';
  if (!total) segs = '<circle class="ring-empty" cx="100" cy="100" r="' + R + '" fill="none" stroke-width="26"/>';
  else {
    let off = 0;
    act.forEach(e => {
      const len = e.v / total * C, gap = act.length > 1 ? Math.min(2.5, len * 0.4) : 0;
      segs += '<circle class="seg' + (state.sel === e.id ? ' on' : state.sel ? ' off' : '') + '" data-seg="' + esc(e.id) + '" cx="100" cy="100" r="' + R + '" fill="none" stroke="' + e.color + '" stroke-width="26" stroke-dasharray="' +
        (len - gap).toFixed(2) + ' ' + (C - len + gap).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"><title>' + esc(e.name) + '</title></circle>';
      off += len;

    : '<div class="cv inc num">' + esc(signed(st.inc)) + '</div><div class="cv exp num">' + esc(signed(-st.exp)) + '</div>' + '<div class="cv pj num" title="' + esc(t('pjProfit')) + '">' + esc(signed(pj)) + '</div>';
  return '<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="' + esc(t('donutAria')) + '"><g transform="rotate(-90 100 100)">' + segs + '</g></svg><div class="center">' + center + '</div></div>';
}

/* ---------- Calculatrice intégrée aux montants ---------- */
function evalExpr(raw) {
  const body = raw.replace(/[+\-*/]+$/, '');
  if (!body) return NaN;
  const tokens = body.match(/\d+\.?\d*|\.\d+|[+\-*/]/g);
  if (!tokens || tokens.join('') !== body) return NaN;
  let sum = 0, term = null, sign = 1, mul = null;
  for (const tk of tokens) {
    if (tk === '*' || tk === '/') { if (term === null) return NaN; mul = tk; }
    else if (tk === '+' || tk === '-') {
      if (term !== null) { sum += sign * term; term = null; mul = null; }
      sign = tk === '+' ? 1 : -1;
    } else {
      const v = parseFloat(tk);
      if (term === null) term = v;
      else if (mul === '*') { term *= v; mul = null; }
      else if (mul === '/') { if (v === 0) return NaN; term /= v; mul = null; }
      else return NaN;
    }
  }
  if (term === null) return NaN;
  return round2(sum + sign * term);
}

const CALC_KEYS = [
  ['C', 'C', 'op'], ['÷', '/', 'op'], ['×', '*', 'op'], ['⌫', 'back', 'op'],
  ['7', '7'], ['8', '8'], ['9', '9'], ['−', '-', 'op'],
  ['4', '4'], ['5', '5'], ['6', '6'], ['+', '+', 'op'],
  ['1', '1'], ['2', '2'], ['3', '3'], ['.', '.'],
  ['0', '0', 'wide'], ['=', '=', 'eq wide']
];
const CALC_SHOW = { '*': '×', '/': '÷', '-': '−' };

function initCalc(root) {
  root.innerHTML = '<div class="calc-display"><div class="calc-expr num"></div><div class="calc-res num">0</div></div><div class="keys">' +
    CALC_KEYS.map(k => '<button type="button" data-k="' + k[1] + '"' + (k[2] ? ' class="' + k[2] + '"' : '') + (k[1] === 'back' ? ' aria-label="' + esc(t('erase')) + '"' : '') + '>' + k[0] + '</button>').join('') + '</div>';
  const exprEl = $('.calc-expr', root), resEl = $('.calc-res', root);
  let expr = '';
  const isOp = c => '+-*/'.indexOf(c) >= 0;
  function show() {
    exprEl.textContent = expr.split('').map(c => CALC_SHOW[c] || c).join('');
    const v = evalExpr(expr);
    resEl.textContent = !expr ? '0' : (isFinite(v) ? fmt(v) : '—');
  }
  function press(k) {
    if (k === 'C') expr = '';
    else if (k === 'back') expr = expr.slice(0, -1);
    else if (k === '=') { const v = evalExpr(expr); if (isFinite(v)) expr = v < 0 ? '-' + String(-v) : String(v); }
    else if (isOp(k)) {
      if (!expr) { if (k !== '-') return; expr = '-'; }
      else if (isOp(expr.slice(-1))) { if (expr.length > 1 || k === '-') expr = expr.slice(0, -1) + k; }
      else expr += k;
    } else if (k === '.') {
      const seg = expr.split(/[+\-*/]/).pop();
      if (seg.indexOf('.') >= 0) return;
      expr += seg === '' ? '0.' : '.';
    } else if (expr.length < 24) expr += k;

  }
  root.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  document.addEventListener('keydown', e => {
    const scrim = root.closest('.scrim');
    if (!scrim || scrim.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    let k = null;
    if (/^[0-9]$/.test(e.key) || '+-*/'.indexOf(e.key) >= 0 && e.key.length === 1) k = e.key;
    else if (e.key === '.' || e.key === ',') k = '.';
    else if (e.key === 'Backspace') k = 'back';
    else if (e.key === 'Enter' && tag !== 'BUTTON') k = '=';
    if (k) { e.preventDefault(); press(k); }
  });
  root.calc = {
    value: () => { const v = evalExpr(expr); return isFinite(v) ? v : NaN; },
    reset: () => { expr = ''; show(); },
    raw: () => expr,
    set: v => { expr = String(v || ''); show(); },
    refresh: show
  };

}

/* Glisser l'écran pour changer d'onglet */
let swipe = null;
document.addEventListener('touchstart', e => {
  const tg = e.target;
  if (e.touches.length !== 1 || tg.closest('input, select, textarea, .calc, .sheet, .scrim, .donut, #pj-filter, #topseg, #accent-chips')) { swipe = null; return; }
  swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!swipe || TABS.indexOf(state.tab) < 0) { swipe = null; return; }
  const c = e.changedTouches[0], dx = c.clientX - swipe.x, dy = c.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || Math.abs(dx) < Math.abs(dy) * 2) return;
  /* Le sens du geste suit la position des onglets dans la barre (valable en arabe aussi) : glisser vers la gauche amène l'onglet situé à droite, vers la droite celui situé à gauche (comme une page qu'on tire) ; au bout de la barre on reboucle. */
  const order = $$('.tabs [data-tab]').filter(b => !b.hidden && TABS.indexOf(b.dataset.tab) >= 0).sort((p, q) => p.getBoundingClientRect().left - q.getBoundingClientRect().left).map(b => b.dataset.tab);
  const n = order.length, i = order.indexOf(state.tab);
  setTab(order[(i + (dx < 0 ? 1 : -1) + n) % n]);
}, { passive: true });

async function commitTx() {

/* Remboursements par tranches, chacun sur le compte choisi */
async function addPayment(loanId, amount, acc) {
  const l = state.loans[loanId];
  if (!l) return;
  const rest = remainingOf(l);
  if (!(amount > 0)) { toast(t('tEnterPay')); return; }
  if (amount > rest + 0.001) { toast(t('tOver', { n: money(rest) })); return; }
  const copy = clone(l);
  copy.payments = (copy.payments || []).concat([{ id: newId(), amount: round2(amount), date: today(), ts: Date.now(), acc: acc || l.acc }]);
  try { await store.put('loans', loanId, copy); toast(t(round2(rest - amount) === 0 ? 'tSettled' : 'tPay')); } catch (err) { /* message déjà affiché */ }
}
$('#loans').addEventListener('submit', e => {
  const f = e.target.closest('[data-pay]'); if (!f) return;
  e.preventDefault(); addPayment(f.dataset.pay, round2(num($('input', f).value)), $('select', f).value);
});
let lp = null;
$('#loans').addEventListener('click', e => {
  const b = e.target.closest('[data-settle]');
  if (b) { const l = state.loans[b.dataset.settle]; if (l) addPayment(b.dataset.settle, remainingOf(l), $('select', b.closest('form')).value); return; }

$('#form-lpay').addEventListener('submit', async e => {

/* Historique et recherche : ouvrir, supprimer */
function toggleItem(key) { state.openKey = state.openKey === key ? null : key; render(); }
async function onListClick(e) {
  const del = e.target.closest('[data-del]');
  if (del) {
    const p = del.dataset.del.split(':'), type = p[0], id = p[1], pid = p[2];
    state.openKey = null;
    try {
      if (type === 'tx') {
        const x = state.tx[id];
        await store.del('tx', id);
        if (x && x.fx) { /* évite que la dépense fixe revienne à la prochaine ouverture */
          const list = clone(fixeds()), f = list.find(z => z.id === x.fx);
          if (f) { f.skip = (f.skip || []).concat([x.fxm]); await store.setSettings({ fixed: list }); }
        }
      } else if (type === 'loan') await store.del('loans', id);
      else if (type === 'pay' && state.loans[id]) {
        const copy = clone(state.loans[id]);
        copy.payments = (copy.payments || []).filter(q => q.id !== pid);
        await store.put('loans', id, copy);
      } else if (type === 'pjpay' && state.products[id]) {
        const copy = clone(state.products[id]); copy.payments = (copy.payments || []).filter(q => q.id !== pid); await store.put('products', id, copy);
      } else if (type === 'sav') {
        const list = clone(goals()), g = list.find(z => z.id === id);
        if (g) { g.deposits = (g.deposits || []).filter(q => q.id !== pid); await store.setSettings({ goals: list }); }
      }
      toast(t('tDeleted'));
    } catch (err) { /* message déjà affiché */ }
    return;
  }
  if (e.target.closest('[data-keep]')) { state.openKey = null; render(); return; }
  const item = e.target.closest('.item'); if (item) toggleItem(item.dataset.key);
}
function onListKey(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')) { e.preventDefault(); toggleItem(e.target.dataset.key); }
}
['#history', '#search-res'].forEach(id => { $(id).addEventListener('click', onListClick); $(id).addEventListener('keydown', onListKey); });

/* Dépense en monnaie locale : le taux est figé dans la dépense */
const expMAD = e => round2(e.cur === 'AED' ? Number(e.amount) * Number(e.rate || 1) : Number(e.amount));

/* Calcul : avances remboursées d'abord (sur l'argent encaissé), puis bénéfice net partagé 50/50 */
function prodCalc(p) {
  const ex = p.expenses || [], cost = sumBy(ex, expMAD);
  const adv1 = sumBy(ex.filter(e => e.who === 1), expMAD), adv2 = round2(cost - adv1);
  const paid = sumBy(p.payments, x => Number(x.amount)), price = Number(p.price || 0);
  const returned = stOf(p.status).kind === 'returned';
  let r1 = 0, r2 = 0, profit = 0;
  if (!returned) {
    const reimb = Math.min(paid, cost);
    if (cost > 0) { r1 = round2(reimb * adv1 / cost); r2 = round2(reimb - r1); }
    profit = round2(Math.max(0, paid - cost));
  }
  const h2 = round2(profit * myPct(cfgOf(p)) / 100), h1 = round2(profit - h2), s1 = round2(r1 + h1), s2 = round2(r2 + h2);
  const gave = sumBy(p.transfers, x => Number(x.amount));
  return { cost: cost, adv1: adv1, adv2: adv2, paid: paid, price: price, rest: Math.max(0, round2(price - paid)), expected: round2(price - cost),
    profit: profit, h1: h1, h2: h2, r1: r1, r2: r2, s1: s1, s2: s2, gave: gave, toGive: returned ? 0 : Math.max(0, round2(s1 - gave)), returned: returned };
}

    out.push({ mod: mod, col: col, client: client, serial: serial, storage: xlStorage(r[pc + 2]), battery: xlBat(r[pc + 3]), aed: aed, rate: rate, sale: sale });
  }
  for (let i = end; i < rows.length; i++) {
    const r = rows[i], lab = r.map(String).join(' ');

  const soldSt = statuses().find(s => s.kind === 'sold') || statuses()[0], base = Date.now(), d = today(), cfg = clone(projCfg());
  const prods = out.map((o, i) => ({ id: newId(), name: o.mod.name, type: o.mod.type, status: soldSt.id, price: o.sale, storage: o.storage, battery: o.battery, color: o.col.n, colorHex: o.col.c, serial: o.serial, courier: '', client: o.client,
    expenses: o.aed > 0 ? [{ id: 'main', who: 1, kind: 'purchase', amount: o.aed, cur: 'AED', rate: o.rate, note: '', date: d }] : [],
    payments: [{ id: newId(), amount: o.sale, date: d, note: '', acc: '' }], partner: partnerOf(pjPartner !== 'all' ? pjPartner : null).id, proj: curPj().id, transfers: [], date: d, ts: base - i, src: 'xl', skipAlert: true }));
  let left = given;
  prods.forEach(p => { if (left <= 0) return; const a = Math.min(left, prodCalc(p).s1); if (a > 0) { p.transfers.push({ id: newId(), amount: round2(a), date: d, note: t('pjImpTr') }); left = round2(left - a); } });
  prods.forEach(p => { if (p.name && pNames().indexOf(p.name) < 0 && (cfg.names = (cfg.names || pNames()).concat([p.name]))) { /* nom ajouté à la liste */ } });
  closeSheets();

    if (cfg.names) await saveCfg(Object.assign(clone(projCfg()), { names: Array.from(new Set(cfg.names)) }));
    toast(t('pjImpDone', { n: prods.length, g: money(round2(given - left)) }));
  } catch (err) { /* message déjà affiché */ }
}

/* ----- Listes déroulantes à flèche (saisie libre conservée) ----- */
function makeCombo(sel, opts) {
  const inp = $(sel), wrap = document.createElement('div'); wrap.className = 'combo';
  inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'cb'; btn.tabIndex = -1; btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  const list = document.createElement('div'); list.className = 'cl'; list.hidden = true;
  wrap.appendChild(btn); wrap.appendChild(list);
  const close = () => { list.hidden = true; wrap.classList.remove('open', 'up'); };
  const open = filter => {
    const all = opts(), q = filter ? norm(inp.value) : '', cur = inp.value.trim().toLowerCase();
    const items = q ? all.filter(o => norm(o.v).indexOf(q) >= 0) : all;
    if (!items.length) { close(); return; }
    list.innerHTML = items.map(o => '<button type="button" data-v="' + esc(o.v) + '"' + (o.c ? ' data-c="' + esc(o.c) + '"' : '') + ' aria-selected="' + (o.v.toLowerCase() === cur) + '">' + (o.c ? '<i class="sw" style="background:' + esc(o.c) + '"></i>' : '') + '<span>' + esc(o.v) + '</span></button>').join('');
    list.hidden = false; wrap.classList.add('open');
    const r = wrap.getBoundingClientRect(); wrap.classList.toggle('up', window.innerHeight - r.bottom < 250 && r.top > 250);
    const s = list.querySelector('[aria-selected="true"]'); if (s) list.scrollTop = Math.max(0, s.offsetTop - 60);
  };
  btn.addEventListener('click', () => { if (list.hidden) open(false); else close(); });
  inp.addEventListener('input', () => { if (inp.value.trim()) open(true); else close(); });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    inp.value = b.dataset.v; close();
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    close();
  });
  document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  new MutationObserver(() => close()).observe(wrap.closest('.scrim') || document.body, { attributes: true, attributeFilter: ['hidden'] });
}

  accs().forEach(a => { if (z.exAcc.indexOf(a.id) >= 0) return; const v = balanceFor(a.id); rows.push({ l: t('zkAccsRow', { n: accName(a) }), v: v }); base += v; });
  goals().forEach(g => { if (z.exGoal.indexOf(g.id) >= 0) return; const v = goalSaved(g); if (!v) return; rows.push({ l: t('zkGoalRow', { n: g.name }), v: v }); base += v; });
  let owed = 0, owe = 0;
  Object.values(state.loans).forEach(l => { if (l.dir === 'lent') owed += remainingOf(l); else owe += remainingOf(l); });
  projDebts().forEach(d => { owe += d.c.toGive; });
  if (z.inclOwed && owed > 0) { rows.push({ l: t('zkOwedRow'), v: owed }); base += owed; }
  if (z.stock !== 'off') {
    let sv = 0; prodList().forEach(p => { const c = prodCalc(p), k = stOf(p.status).kind; if (c.returned || (k !== 'stock' && k !== 'selling' && k !== 'repair')) return; sv += z.stock === 'price' ? c.price : c.cost; });
    if (sv > 0) { rows.push({ l: t('zkStockRow'), v: sv }); base += sv; }
  }
  if (Number(z.add) > 0) { rows.push({ l: t('zkAddRow'), v: Number(z.add) }); base += Number(z.add); }
  if (z.inclOwe && owe > 0) { rows.push({ l: t('zkOweRow'), v: -owe }); base -= owe; }
  if (Number(z.sub) > 0) { rows.push({ l: t('zkSubRow'), v: -Number(z.sub) }); base -= Number(z.sub); }
  base = round2(base);
  const nisab = round2(Number(z.grams) * Number(z.gold)), ok = Number(z.gold) > 0, reached = ok && base >= nisab && base > 0;
  return { rows: rows, base: base, nisab: nisab, ok: ok, reached: reached, due: reached ? round2(base * Number(z.rate) / 100) : 0 };
}

const stamp = () => today();
async function saveFile(filename, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) {
    /* Hors Claude (appli installée) : partage du fichier ou téléchargement classique */
    try {
      const blob = new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : /\.html$/.test(filename) ? 'text/html' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: filename }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; } }
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) { toast(t('tNoDl')); return false; }
  }
  try { await dl.save({ filename: filename, data: data }); return true; } catch (e) { if (e && e.code !== 'declined') toast(t('tNoDl')); return false; }
}

    return [p.name, p.type || '', p.storage || '', p.battery || '', p.color || '', p.serial || '', p.client || '', stName(stOf(p.status)), p.price || 0, c.paid, c.cost, c.profit, c.s1, c.s2];
  })));
  const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });

function homeAlert() {
  const d = tabOn('zakat') ? zkDays() : null;
  if (d !== null && d <= 30) return { text: t('zkAlert', { m: zkWhen(d) }), go: 'zakat' };
  const k = Number(state.settings.bkDays) || 0;
  if (k > 0) {
    const last = (typeof prefs !== 'undefined' && prefs.lastBackup) || '';
    const days = last ? Math.floor((new Date(today()) - new Date(last)) / 864e5) : 9999;
    if (days >= k) return { text: t('bkAlert'), go: 'settings' };
  }
  const over = budgetRows().filter(r => r.used >= r.lim);
  if (over.length) return { text: t('bdAlert', { n: catName(over[0].c) }), go: 'reports' };
  return null;
}
